# ditexpo-cms.conf — Nginx vhost for the ditexpo CMS admin backend.
#
# This origin serves the CMS ADMIN ONLY (ditexpo-cms.idcnova.com). The public
# site (ditexpo.com) is served by Cloudflare Pages from the GitHub export and
# never touches this server. TLS terminates on the Huawei Cloud ELB; the ELB
# forwards HTTP to this server's port 80.

server {
	listen 80;
	server_name ditexpo-cms.idcnova.com;

	# Everything (admin app, API, collab socket, media) is served by the
	# container — Nginx is a pure dispatcher.
	location / {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto http;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 300s;
		client_max_body_size 256m;
	}
}
